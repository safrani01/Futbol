<style>
:root{--bg:#0b2e22;--bg2:#10402f;--card:#15503b;--line:#1f6a4e;--tx:#eef6f1;--mut:#9cc4b0;--gold:#e8c35a;--win:#3ecf7a;--draw:#e8c35a;--loss:#ef6a5e;--live:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:720px;margin:0 auto;padding:0 10px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:19px;margin:0;flex:1}
header small{color:var(--mut);font-size:11px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.gold{background:var(--gold);color:#241c00;border-color:var(--gold);font-weight:700}
.btn.sm{padding:5px 9px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px}
.chip.on{background:var(--gold);color:#241c00;border-color:var(--gold);font-weight:700}
.bar{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.bar select,.bar input{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bar input{flex:1;min-width:120px}
.rnd{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:12px;padding:6px;margin-bottom:8px}
.rnd b{font-size:16px}
.day{color:var(--gold);font-size:13px;font-weight:700;margin:14px 2px 6px;text-transform:capitalize}
.lgh{color:var(--mut);font-size:12px;margin:8px 2px 3px}
.m{display:grid;grid-template-columns:1fr 62px 1fr 34px;align-items:center;gap:4px;background:var(--card);border-radius:12px;padding:9px 6px 9px 10px;margin-bottom:6px}
.t{display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer}
.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.r{justify-content:flex-end;text-align:right}
.t img{width:20px;height:20px;object-fit:contain;flex:none}
.t.w span{font-weight:700}
.sc{text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.sc.fut{font-weight:600;font-size:13px;color:var(--mut)}
.sc.live{color:var(--live)}
.sc small{display:block;font-size:10px;font-weight:400;color:var(--mut)}
.add{background:none;border:1px solid var(--line);border-radius:8px;color:var(--gold);width:30px;height:30px;font-size:17px;cursor:pointer}
.add.on{background:var(--gold);color:#241c00}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500;text-align:center;padding:6px 2px}
td{padding:7px 2px;text-align:center;border-top:1px solid var(--line)}
td.n{text-align:left;cursor:pointer}
td.n div{display:flex;align-items:center;gap:6px}
td.n img{width:18px;height:18px;object-fit:contain}
td b{color:var(--gold)}
.tbl{background:var(--card);border-radius:12px;padding:4px 8px;margin-bottom:10px}
.msg{background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:14px;margin:10px 0;color:var(--mut);line-height:1.5}
.msg.err{border-color:var(--loss);color:#ffd2cd}
.form{display:inline-flex;gap:3px}
.f{width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:#10231a}
.f.G{background:var(--win)}.f.B{background:var(--draw)}.f.M{background:var(--loss)}
nav{position:fixed;left:0;right:0;bottom:0;background:#082219;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:10px;cursor:pointer;position:relative}
nav button i{display:block;font-style:normal;font-size:18px;margin-bottom:1px}
nav button.on{color:var(--gold)}
nav button em{position:absolute;top:3px;left:55%;background:var(--loss);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-style:normal}
.cmp{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.cr{margin:11px 0}
.cr .lab{text-align:center;color:var(--mut);font-size:12px;margin-bottom:3px}
.cr .v{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.cr .v span:last-child{text-align:right}
.bars{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg2)}
.bars i{display:block;height:100%}
.bars i:first-child{background:var(--gold)}.bars i:last-child{background:#6ec3ff}
.sel{display:grid;grid-template-columns:1fr 40px 1fr;gap:6px;align-items:center;margin-bottom:10px}
.sel select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px}
.cp{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.cp .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.cp .picks{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.cp .picks button{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--tx)}
.cp .picks button.on{background:var(--gold);color:#241c00;font-weight:700;border-color:var(--gold)}
.cp .bot{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.cp input{width:74px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.ok{color:var(--win);font-weight:700}.no{color:var(--loss);font-weight:700}.wait{color:var(--mut)}
.sum{background:var(--bg2);border:1px solid var(--gold);border-radius:12px;padding:12px;margin:10px 0;display:grid;gap:7px}
.sum div{display:flex;justify-content:space-between;align-items:center}
.set label{display:block;margin:12px 0 5px;color:var(--mut);font-size:13px}
.set input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px}
.set ol{padding-left:20px;line-height:1.6;color:var(--mut)}
.set a{color:var(--gold)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
#sheet h2 img{width:28px;height:28px;object-fit:contain}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.kp div{background:var(--card);border-radius:10px;text-align:center;padding:8px 2px}
.kp b{display:block;font-size:17px;color:var(--gold)}
.kp span{font-size:11px;color:var(--mut)}
.od{grid-column:1/-1;font-size:12px;color:var(--mut);text-align:center;margin-top:2px}
.od b{color:var(--gold);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
select.lsel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 6px;font-size:13px;max-width:104px}
html[dir=rtl] .m,html[dir=rtl] table,html[dir=rtl] .kp,html[dir=rtl] nav,html[dir=rtl] .cr .v,html[dir=rtl] .sel,html[dir=rtl] .bars,html[dir=rtl] .rnd{direction:ltr}
html[dir=rtl] .set ol{padding-left:0;padding-right:20px}
html[dir=rtl] .cp .top b,html[dir=rtl] .rnd b{unicode-bidi:plaintext}
html[dir=rtl] .od,html[dir=rtl] .sc small{unicode-bidi:plaintext}
</style>
</head>

async function http(url,headers){
 const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
 try{
  const r=await fetch(url,{headers,signal:ac.signal});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
  return await r.json();
 }catch(e){
  if(e&&e.name==='AbortError'){const x=new Error('timeout');x.status='timeout';throw x}
  throw e;
 }finally{clearTimeout(tm)}
}
const fdTimes=[];
async function fdThrottle(){

  const n=Date.now();
  while(fdTimes.length&&n-fdTimes[0]>60000)fdTimes.shift();
  if(fdTimes.length<9)break;
  S.msg='Dakikalık istek sınırı için kısa bekleme…';render();
  await sleep(fdTimes[0]+60000-n+300);

}

 if(md!=null&&(!stage||['REGULAR_SEASON','GROUP_STAGE','LEAGUE_STAGE'].includes(stage))){key='MD'+md;rl=md+'. '+(lg.cup?'Maç Günü':'Hafta')}
 else{key=stage||('MD'+md);rl=STAGES[stage]||stage||(md+'. Hafta')}

function nES(e){
 const c=((e.competitions||[{}])[0])||{};
 const cs=c.competitors||[];
 const H=cs.find(x=>x.homeAway==='home')||cs[0]||{},A=cs.find(x=>x.homeAway==='away')||cs[1]||{};
 const tm=x=>{const t=x.team||{};return {id:String(t.id||x.id||'tbd'),n:t.shortDisplayName||t.displayName||t.name||'Belli değil',c:t.logo||(t.logos&&t.logos[0]&&t.logos[0].href)||''}};
 const st=(((e.status||c.status||{}).type)||{});
 let status='SCHEDULED';
 if(st.state==='post'||st.completed)status='FINISHED';else if(st.state==='in')status='LIVE';
 if(/POSTPONED|CANCEL|SUSPEND|ABANDON/.test((st.name||'').toUpperCase()))status='PPD';
 const pl=status==='FINISHED'||status==='LIVE';
 const n=v=>(v==null||v==='')?null:Math.round(+v);
 return {id:String(e.id),date:e.date,status,h:tm(H),a:tm(A),hg:pl?n(H.score):null,ag:pl?n(A.score):null,key:'',rl:'',grp:''};
}
function assignRounds(list,lg){
 const cnt={};
 list.sort((a,b)=>a.date<b.date?-1:1).forEach(m=>{
  const r=Math.max(cnt[m.h.id]||0,cnt[m.a.id]||0)+1;
  cnt[m.h.id]=r;cnt[m.a.id]=r;
  m.key='MD'+r;m.rl=r+'. '+(lg.cup?'Maç Günü':'Hafta');
 });
}
function esRanges(lg,y){
 if(lg.seasons)return [y+'0601-'+y+'0731'];
 if(lg.cal)return [y+'0101-'+y+'0228',y+'0301-'+y+'0430',y+'0501-'+y+'0630',y+'0701-'+y+'0831',y+'0901-'+y+'1031',y+'1101-'+y+'1231'];
 return [y+'0701-'+y+'0930',y+'1001-'+y+'1130',y+'1201-'+(y+1)+'0131',(y+1)+'0201-'+(y+1)+'0331',(y+1)+'0401-'+(y+1)+'0531',(y+1)+'0601-'+(y+1)+'0630'];
}
function nTabES(j){
 const out=[],kids=j.children||[j];
 kids.forEach(ch=>{
  const ent=(ch.standings&&ch.standings.entries)||[];if(!ent.length)return;
  const rows=ent.map(en=>{const s={};(en.stats||[]).forEach(x=>{s[x.name]=x.value});const t=en.team||{};
   return {pos:+s.rank||0,t:{id:String(t.id),n:t.shortDisplayName||t.displayName,c:t.logo||(t.logos&&t.logos[0]&&t.logos[0].href)||''},p:+s.gamesPlayed||0,w:+s.wins||0,d:+s.ties||0,l:+s.losses||0,gf:+s.pointsFor||0,ga:+s.pointsAgainst||0,pts:+s.points||0}});
  rows.sort((a,b)=>a.pos-b.pos);
  out.push({name:kids.length>1?(ch.name||''):'',rows});
 });
 return out;
}
function noData(){const e=new Error('nodata');e.status='nodata';return e}
async function loadES(lg,force,light,deep){
 if(!lg.es)throw noData();
 const y=getSeason(lg),d=getD(lg);
 if((d.via||lg.src)!=='ES'){d.matches={};d.loaded={};d.table=null;d.full=false;d.cur=null}
 d.via='ES';
 if(!force&&d.full&&Date.now()-d.t<TTL)return;
 const rg=esRanges(lg,y),got={};
 for(let i=0;i<rg.length;i++){
  S.msg=lg.name+' · ESPN '+(i+1)+'/'+rg.length;if(S.busy)render();
  const j=await http(`${ES_BASE}/site/v2/sports/soccer/${lg.es}/scoreboard?dates=${rg[i]}&limit=500`);
  (j.events||[]).forEach(e=>{const m=nES(e);got[m.id]=m});
 }
 const list=Object.values(got);
 if(!list.length)throw noData();
 assignRounds(list,lg);
 d.matches={};list.forEach(m=>{d.matches[m.id]=m});
 d.full=true;d.t=Date.now();
 if(!light){try{d.table=nTabES(await http(`${ES_BASE}/v2/sports/soccer/${lg.es}/standings`))}catch(e){}}
 saveSnap(lg);
}
function applyData(lg,d,j){
 d.matches={};j.matches.forEach(m=>{d.matches[m.id]=m});
 d.table=j.table||null;d.loaded={};d.full=true;d.cur=null;d.via='DATA';d.t=Date.now();d.dataT=j.t;
 saveSnap(lg);
}
async function loadDATA(lg,force){
 const y=getSeason(lg),d=getD(lg);
 if(y!==seasonOpts(lg)[0])throw noData();
 if(!force&&d.via==='DATA'&&Date.now()-d.t<TTL)return;
 if(!force&&LS.get('nodata_'+lg.id,0)>Date.now()-3600000)throw noData();
 let r;
 try{r=await fetch('data/'+lg.id.replace(':','_')+'.json?v='+Math.floor(Date.now()/300000))}catch(e){throw noData()}
 if(!r.ok){LS.set('nodata_'+lg.id,Date.now());throw noData()}
 let j;try{j=await r.json()}catch(e){throw noData()}
 if(!j||!j.matches||!j.matches.length)throw noData();
 if(Date.now()-new Date(j.t).getTime()>12*3600000){STALE[lg.id]=j;throw noData()}
 applyData(lg,d,j);
}
function computeTable(d){
 const T={};
 Object.values(d.matches).filter(m=>m.status==='FINISHED'&&m.hg!=null&&m.ag!=null).forEach(m=>{
  [[m.h,m.hg,m.ag],[m.a,m.ag,m.hg]].forEach(([t,gf,ga])=>{
   const r=T[t.id]||(T[t.id]={t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
   r.p++;r.gf+=gf;r.ga+=ga;if(gf>ga){r.w++;r.pts+=3}else if(gf===ga){r.d++;r.pts++}else r.l++;
  });
 });
 const rows=Object.values(T).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf).map((r,i)=>Object.assign({pos:i+1},r));
 return rows.length?[{name:'',rows}]:[];
}
function chainFor(lg){
 const c=['DATA'];
 if(LS.get('espfirst',false)&&lg.es){c.push('ES',lg.src)}else{c.push(lg.src);if(lg.es)c.push('ES')}
 return c;
}
async function loadLeague(lg,force,light,deep){
 let last=null;
 for(const s of chainFor(lg)){
  try{
   if(s==='DATA')await loadDATA(lg,force);
   else if(s==='ES')await loadES(lg,force,light,deep);
   else await loadNative(lg,force,light,deep);
   return;
  }catch(e){if(!(e&&e.status==='nodata'))last=e}
 }
 if(STALE[lg.id]){applyData(lg,getD(lg),STALE[lg.id]);return}
 if(last)throw last;
 throw new Error('Bu lig için veri kaynağı bulunamadı');
}
async function load(force){
 const lg=curLg();S.err='';S.busy=true;S.msg='';render();
 try{await loadLeague(lg,force,false)}catch(e){S.err=errText(e)}
 S.busy=false;S.msg='';syncCoupon();render();
}
async function loadAll(force,deep){
 const favs=LS.get('favs',DEFAULT_FAVS),errs=[];
 S.busy=true;S.err='';render();
 for(const id of favs){
  const lg=allLeagues().find(l=>l.id===id);if(!lg)continue;
  S.msg=lg.name+' yükleniyor…';render();
  try{await loadLeague(lg,force,true,deep)}catch(e){if(e instanceof TypeError){errs.length=0;errs.push(errText(e));break}errs.push(lg.name+': '+errText(e))}
 }
 await loadOdds();
 S.busy=false;S.msg='';S.err=errs.join('\n');syncCoupon();render();
}

/* ====== Tur mantığı ====== */
function getRounds(lg,d){
 if((d.via||lg.src)==='TS'){
  const max=lg.max||38,rounds=[];
  for(let i=1;i<=max;i++)rounds.push({key:'R'+i,label:i+'. Hafta'});
  return {rounds,cur:'R'+(d.cur||1)};
 }
 const g={};
 Object.values(d.matches).forEach(m=>{
  const o=g[m.key]||(g[m.key]={key:m.key,label:m.rl,min:m.date,open:false});
  if(m.date<o.min)o.min=m.date;
  if(m.status==='SCHEDULED'||m.status==='LIVE')o.open=true;
 });
 const rounds=Object.values(g).sort((a,b)=>a.min<b.min?-1:1);
 const op=rounds.find(r=>r.open);
 return {rounds,cur:op?op.key:(rounds.length?rounds[rounds.length-1].key:null)};
}
function matchesOf(d,key){return Object.values(d.matches).filter(m=>m.key===key).sort((a,b)=>a.date<b.date?-1:1)}

/* ====== İstatistik ====== */
function tstats(tid,ms){
 const r={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,cs:0,btts:0,o25:0,hm:{p:0,pts:0},aw:{p:0,pts:0},form:[]};
 ms.filter(m=>m.status==='FINISHED'&&m.hg!=null&&m.ag!=null).sort((a,b)=>a.date<b.date?-1:1).forEach(m=>{
  const home=m.h.id===tid,away=m.a.id===tid;if(!home&&!away)return;
  const gf=home?m.hg:m.ag,ga=home?m.ag:m.hg;
  const res=gf>ga?'G':gf===ga?'B':'M',pt=res==='G'?3:res==='B'?1:0;
  r.p++;r.gf+=gf;r.ga+=ga;r.pts+=pt;
  if(res==='G')r.w++;else if(res==='B')r.d++;else r.l++;
  if(ga===0)r.cs++;if(gf>0&&ga>0)r.btts++;if(gf+ga>2.5)r.o25++;
  const side=home?r.hm:r.aw;side.p++;side.pts+=pt;
  r.form.push({res,m,pt});
 });
 return r;
}
function teamList(d){
 const t={};
 Object.values(d.matches).forEach(m=>{[m.h,m.a].forEach(x=>{if(x.id&&x.id!=='tbd'&&x.id!=='undefined')t[x.id]=x})});
 return Object.values(t).sort((a,b)=>a.n.localeCompare(b.n,'tr'));
}

/* ====== Kupon ====== */
function evalPick(p,m){
 if(!m||m.status!=='FINISHED'||m.hg==null||m.ag==null)return null;
 const h=m.hg,a=m.ag,t=h+a;
 return {'1':h>a,'X':h===a,'2':h<a,'1X':h>=a,'X2':h<=a,'12':h!==a,'Ü1.5':t>1.5,'Ü2.5':t>2.5,'A2.5':t<2.5,'A3.5':t<3.5,'KG+':h>0&&a>0,'KG-':!(h>0&&a>0)}[p];
}
function cpStatus(items){
 if(!items.length)return {txt:'—',cls:'wait'};
 const r=items.map(i=>evalPick(i.pick,i.m));
 if(r.some(x=>x===false))return {txt:'Yattı ✗',cls:'no'};
 if(r.every(x=>x===true))return {txt:'Tuttu ✓',cls:'ok'};
 return {txt:'Bekliyor ('+r.filter(x=>x===true).length+'/'+items.length+' tuttu)',cls:'wait'};
}
function totalOdd(items){const o=items.map(i=>+i.odd).filter(x=>x>0);return o.length===items.length&&o.length?o.reduce((a,b)=>a*b,1):0}
function syncCoupon(){
 const w1=s=>String(s||'').toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9 ]/g,'').split(' ')[0];
 const find=(lgId,mid,snap)=>{
  for(const k in S.data){if(k.indexOf(lgId+'|')===0&&S.data[k].matches[mid])return S.data[k].matches[mid]}
  if(snap){for(const k in S.data){if(k.indexOf(lgId+'|')!==0)continue;const hit=Object.values(S.data[k].matches).find(m=>w1(m.h.n)===w1(snap.h.n)&&w1(m.a.n)===w1(snap.a.n)&&Math.abs(new Date(m.date)-new Date(snap.date))<36*3600000);if(hit)return hit}}
  return null};
 const cp=LS.get('coupon',[]);let ch=false;
 cp.forEach(i=>{const m=find(i.lg,i.mid,i.m);if(m&&JSON.stringify(m)!==JSON.stringify(i.m)){i.m=m;ch=true}});
 if(ch)LS.set('coupon',cp);
 const hs=LS.get('chist',[]);let hc=false;
 hs.forEach(c=>c.items.forEach(i=>{const m=find(i.lg,i.mid,i.m);if(m&&JSON.stringify(m)!==JSON.stringify(i.m)){i.m=m;hc=true}}));
 if(hc)LS.set('chist',hs);
}
function inCoupon(lgId,mid){return LS.get('coupon',[]).some(i=>i.lg===lgId&&i.mid===mid)}
function toggleCoupon(lgId,mid){
 const cp=LS.get('coupon',[]);const ix=cp.findIndex(i=>i.lg===lgId&&i.mid===mid);
 if(ix>=0)cp.splice(ix,1);
 else{
  let m=null;for(const k in S.data){if(k.indexOf(lgId+'|')===0&&S.data[k].matches[mid])m=S.data[k].matches[mid]}
  if(m)cp.push({lg:lgId,mid,m,pick:'1',odd:''});
 }
 LS.set('coupon',cp);
}

/* ====== Görünümler ====== */
function crest(c){return c?`<img src="${esc(c)}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}
function rowHTML(m,lgId){
 const fin=m.status==='FINISHED',live=m.status==='LIVE',ppd=m.status==='PPD';
 const hw=fin&&m.hg>m.ag,aw=fin&&m.ag>m.hg;
 const sc=(fin||live)&&m.hg!=null?`<div class="sc ${live?'live':''}">${m.hg} - ${m.ag}${live?'<small>CANLI</small>':''}</div>`:ppd?`<div class="sc fut">Ertelendi</div>`:`<div class="sc fut">${fmtT(m.date)}</div>`;
 const on=inCoupon(lgId,m.id);
 let od='';
 if(!fin&&!live){const ev=findOdds(m,lgId);if(ev){const p=[];if(ev.o1)p.push('1 <b>'+f1(ev.o1)+'</b>');if(ev.ox)p.push('X <b>'+f1(ev.ox)+'</b>');if(ev.o2)p.push('2 <b>'+f1(ev.o2)+'</b>');if(ev.ov)p.push('Ü2.5 <b>'+f1(ev.ov)+'</b>');if(ev.un)p.push('A2.5 <b>'+f1(ev.un)+'</b>');od='<div class="od">'+p.join(' · ')+'</div>'}}
 return `<div class="m"><div class="t ${hw?'w':''}" data-a="team" data-id="${esc(m.h.id)}" data-lg="${esc(lgId)}">${crest(m.h.c)}<span>${esc(m.h.n)}</span></div>${sc}<div class="t r ${aw?'w':''}" data-a="team" data-id="${esc(m.a.id)}" data-lg="${esc(lgId)}"><span>${esc(m.a.n)}</span>${crest(m.a.c)}</div><button class="add ${on?'on':''}" data-a="cp" data-lg="${esc(lgId)}" data-id="${esc(m.id)}" title="Kupona ekle">${on?'✓':'+'}</button>${od}</div>`;
}
function listByDay(ms,lgId){
 let h='',last=0;
 ms.forEach(m=>{const k=dayKey(m.date);if(k!==last){h+=`<div class="day">${fmtD(m.date)}</div>`;last=k}h+=rowHTML(m,lgId)});
 return h;
}
function filt(ms){
 if(S.filter==='done')return ms.filter(m=>m.status==='FINISHED');
 if(S.filter==='next')return ms.filter(m=>m.status!=='FINISHED');
 return ms;
}
function filterBar(){
 return `<div class="chips">${[['all','Hepsi'],['done','Biten'],['next','Gelecek']].map(([k,l])=>`<div class="chip ${S.filter===k?'on':''}" data-a="filter" data-v="${k}">${l}</div>`).join('')}</div>`;
}
function leagueChips(){
 return `<div class="chips">${allLeagues().map(l=>`<div class="chip ${S.lg===l.id?'on':''}" data-a="lg" data-id="${esc(l.id)}">${l.flag||'⚽'} ${esc(l.name)}</div>`).join('')}</div>`;
}
function statusBox(){
 let h='';
 if(S.busy)h+=`<div class="msg"><span class="spin"></span>${esc(S.msg||'Yükleniyor…')}</div>`;
 if(S.err)h+=`<div class="msg err">${esc(S.err).replace(/\n/g,'<br>')}</div>`;
 return h;
}
function viewMac(){
 const lg=curLg(),y=getSeason(lg),d=getD(lg);
 const so=seasonOpts(lg);
 let h=leagueChips();
 h+=`<div class="bar"><select data-a="season">${so.map(s=>`<option value="${s}" ${s===y?'selected':''}>${lg.src==='TS'||!lg.cup&&!lg.seasons?s+'/'+String(s+1).slice(2):s}</option>`).join('')}</select><input id="q" placeholder="Takım ara…" value="${esc(S.q)}" data-a="q"></div>`;
 h+=statusBox();
 if(!Object.keys(d.matches).length){if(!S.busy&&!S.err)h+=`<div class="msg">Henüz veri yok. Sağ üstteki ↻ ile yükle.</div>`;return h}
 const q=S.q.trim().toLocaleLowerCase('tr');
 if(q.length>=2){
  const ms=Object.values(d.matches).filter(m=>m.h.n.toLocaleLowerCase('tr').includes(q)||m.a.n.toLocaleLowerCase('tr').includes(q)).sort((a,b)=>a.date<b.date?-1:1);
  const done=ms.filter(m=>m.status==='FINISHED').reverse(),nx=ms.filter(m=>m.status!=='FINISHED');
  h+=`<div class="day">Gelecek / oynanmamış (${nx.length})</div>`+nx.map(m=>rowHTML(m,lg.id)).join('')+`<div class="day">Oynananlar (${done.length})</div>`+done.map(m=>rowHTML(m,lg.id)).join('');
  return h;
 }
 const {rounds,cur}=getRounds(lg,d);
 const k=dkey(lg,y);

 const r=rounds[i];
 if(!r)return h+`<div class="msg">Bu sezon için maç bulunamadı.</div>`;
 h+=`<div class="rnd"><button class="btn sm" data-a="rnd" data-v="-1" ${i<=0?'disabled':''}>‹</button><b>${esc(r.label)}</b><button class="btn sm" data-a="rnd" data-v="1" ${i>=rounds.length-1?'disabled':''}>›</button></div>`;
 h+=filterBar();
 const ms=filt(matchesOf(d,r.key));
 h+=ms.length?listByDay(ms,lg.id):`<div class="msg">${(d.via||lg.src)==='TS'&&!d.loaded[+r.key.slice(1)]&&!d.full?'Bu tur henüz yüklenmedi, yükleniyor…':'Bu turda gösterilecek maç yok.'}</div>`;
 return h;
}

function viewKiyas(){

 h+=`<div class="sel"><select data-a="cmpA">${opt(S.cmp.a)}</select><button class="btn sm" data-a="swap">⇄</button><select data-a="cmpB">${opt(S.cmp.b)}</select></div>`;

 const ms=Object.values(d.matches);
 const a=tstats(A.id,ms),b=tstats(B.id,ms);
 const per=(x,n)=>x.p?n/x.p:NaN,pc=(x,n)=>x.p?100*n/x.p:NaN;
 const rows=[

  ['Galibiyet %',pc(a,a.w),pc(b,b.w),0,1],
  ['Gol yemeden bitirme %',pc(a,a.cs),pc(b,b.cs),0,1],
  ['2.5 üst %',pc(a,a.o25),pc(b,b.o25),0,0],
  ['Karşılıklı gol %',pc(a,a.btts),pc(b,b.btts),0,0],
  [esc(A.n)+' iç saha (puan/maç) vs '+esc(B.n)+' deplasman',a.hm.p?a.hm.pts/a.hm.p:NaN,b.aw.p?b.aw.pts/b.aw.p:NaN,2,1]
 ];
 const bar=(x,y,dec,dir)=>{
  const s=(isFinite(x)?x:0)+(isFinite(y)?y:0);const wa=s?100*(isFinite(x)?x:0)/s:50;
  return `<div class="bars"><i style="width:${wa}%"></i><i style="width:${100-wa}%"></i></div>`;

/* ====== Analiz motoru (Poisson) ====== */
function poisP(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function leagueModel(d){
 const fin=Object.values(d.matches).filter(m=>m.status==='FINISHED'&&m.hg!=null&&m.ag!=null).sort((a,b)=>a.date<b.date?-1:1);
 if(fin.length<12)return null;
 let sh=0,sa=0;fin.forEach(m=>{sh+=m.hg;sa+=m.ag});
 const avgH=sh/fin.length,avgA=sa/fin.length,avgG=(avgH+avgA)/2;
 const tm={};
 fin.forEach(m=>{
  (tm[m.h.id]=tm[m.h.id]||[]).push([m.hg,m.ag]);
  (tm[m.a.id]=tm[m.a.id]||[]).push([m.ag,m.hg]);
 });
 const str={};
 for(const id in tm){
  const a=tm[id],n=a.length;let w=0,gf=0,ga=0;
  for(let i=0;i<n;i++){const wt=Math.pow(0.93,n-1-i);w+=wt;gf+=wt*a[i][0];ga+=wt*a[i][1]}
  const k=n/(n+4);
  str[id]={n,att:1+((gf/w)/avgG-1)*k,def:1+((ga/w)/avgG-1)*k};
 }
 return {avgH,avgA,str};
}
function predict(mod,m){
 const h=mod.str[m.h.id],a=mod.str[m.a.id];
 if(!h||!a||h.n<4||a.n<4)return null;
 const lh=Math.max(0.2,mod.avgH*h.att*a.def),la=Math.max(0.2,mod.avgA*a.att*h.def);
 const G=9,grid=[];let tot=0;
 for(let i=0;i<G;i++){grid[i]=[];for(let j=0;j<G;j++){let p=poisP(lh,i)*poisP(la,j);if(i===j&&i<3)p*=1.06;grid[i][j]=p;tot+=p}}
 let p1=0,px=0,p2=0,o15=0,o25=0,o35=0,bt=0;
 for(let i=0;i<G;i++)for(let j=0;j<G;j++){
  const p=grid[i][j]/tot;
  if(i>j)p1+=p;else if(i===j)px+=p;else p2+=p;
  if(i+j>1.5)o15+=p;if(i+j>2.5)o25+=p;if(i+j>3.5)o35+=p;if(i>0&&j>0)bt+=p;
 }
 return {lh,la,n:Math.min(h.n,a.n),p:{'1':p1,'X':px,'2':p2,'1X':p1+px,'X2':px+p2,'12':p1+p2,'Ü1.5':o15,'Ü2.5':o25,'A2.5':1-o25,'A3.5':1-o35,'KG+':bt,'KG-':1-bt}};
}
function analyzePool(days){
 const favs=LS.get('favs',DEFAULT_FAVS),now=Date.now(),end=now+days*86400000;
 const out=[];let skipped=0,noData=[];
 allLeagues().filter(l=>favs.includes(l.id)&&!(l.id==='FD:WC'||l.id==='FD:EC')).forEach(lg=>{
  const d=S.data[dkey(lg,getSeason(lg))];
  if(!d||!Object.keys(d.matches).length){noData.push(lg.name);return}
  const mod=leagueModel(d);
  const up=Object.values(d.matches).filter(m=>m.status==='SCHEDULED'&&new Date(m.date).getTime()>now-3600000&&new Date(m.date).getTime()<end);
  if(!mod){if(up.length)noData.push(lg.name+' (az veri)');return}
  up.forEach(m=>{const r=predict(mod,m);if(r)out.push({lg,m,r});else skipped++});
 });
 return {items:out.sort((a,b)=>a.m.date<b.m.date?-1:1),skipped,noData};
}

/* ====== Oranlar ====== */
const EST_FACTOR=0.93;
async function loadOdds(){
 try{const r=await fetch('data/odds.json?v='+Math.floor(Date.now()/300000));if(!r.ok)return;const j=await r.json();S.odds=j.events||[];S.oddsT=j.t}catch(e){}
}
function nm(s){return String(s||'').toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\b(fc|sk|afc|cf|ac|as|ss|sc|fk|spor|kulubu|club|vfb|vfl|tsg|rb|1899)\b/g,' ').replace(/[^a-z0-9]/g,'')}
function sameTeam(a,b){const x=nm(a),y=nm(b);if(!x||!y)return false;return x===y||(x.length>=4&&y.length>=4&&(x.includes(y)||y.includes(x)))||x.slice(0,5)===y.slice(0,5)}
function findOdds(m,lgId){
 if(!S.odds.length)return null;
 const t=new Date(m.date).getTime();
 return S.odds.find(o=>o.lg===lgId&&Math.abs(new Date(o.date)-t)<30*3600000&&sameTeam(o.h,m.h.n)&&sameTeam(o.a,m.a.n))||null;
}
function dcOdd(ev,a,b){
 if(!(ev.o1&&ev.ox&&ev.o2&&a&&b))return null;
 const s=1/ev.o1+1/ev.ox+1/ev.o2;
 return Math.max(1.01,0.95*s/(1/a+1/b));
}
function realOdd(ev,k){
 return {'1':ev.o1,'X':ev.ox,'2':ev.o2,'1X':dcOdd(ev,ev.o1,ev.ox),'X2':dcOdd(ev,ev.ox,ev.o2),'12':dcOdd(ev,ev.o1,ev.o2),'Ü2.5':ev.ov,'A2.5':ev.un}[k]||null;
}
function oddOf(x,k){
 const ev=findOdds(x.m,x.lg.id),r=ev?realOdd(ev,k):null;
 if(r)return {o:r,real:true};
 return {o:EST_FACTOR/x.r.p[k],real:false};
}
function rankPicks(r,mode){
 const set={safe:['1','2','1X','X2','Ü1.5','Ü2.5','A2.5','A3.5','KG+','KG-'],bal:['1','2','1X','X2','Ü2.5','A2.5','KG+','KG-'],risk:['1','2','X','Ü2.5','A2.5','KG+','KG-']}[mode];
 const pen={'1X':.10,'X2':.10,'Ü1.5':.12,'A3.5':.10};
 return set.map(k=>({k,p:r.p[k],s:r.p[k]-(mode==='safe'?0:(pen[k]||0))*(mode==='bal'?1:0)-(mode==='safe'?(pen[k]||0)*0.5:0)})).sort((x,y)=>y.s-x.s);
}
function buildAdvice(pool){
 const {n,mode,minOdd}=S.adv;
 const th={safe:.68,bal:.55,risk:.45}[mode];
 const cap=Math.max(2,Math.ceil(n*0.35)),cnt={};
 const cands=[];
 pool.items.forEach(x=>{
  const el=rankPicks(x.r,mode).filter(c=>c.p>=th).map(c=>Object.assign({},c,oddOf(x,c.k))).filter(c=>c.o>=minOdd);
  if(el.length)cands.push({x,el});
 });
 cands.sort((a,b)=>b.el[0].s-a.el[0].s);
 const out=[];
 for(const c of cands){
  if(out.length>=n)break;
  const pk=c.el.find(e=>(cnt[e.k]||0)<cap);
  if(pk){cnt[pk.k]=(cnt[pk.k]||0)+1;out.push(Object.assign({},c.x,{pk}))}
 }
 return out.sort((a,b)=>a.m.date<b.m.date?-1:1);
}
function whyText(x){
 const r=x.r,k=x.pk.k;
 const sc=f1(r.lh,1)+' – '+f1(r.la,1);
 return 'Beklenen skor '+sc+' · 1/X/2: %'+Math.round(r.p['1']*100)+'/%'+Math.round(r.p['X']*100)+'/%'+Math.round(r.p['2']*100);
}

 ${cu.length?`<div style="color:var(--mut);font-size:13px">Eklenenler: ${cu.map(l=>esc(l.name)+` <a href="#" data-a="rmlg" data-id="${esc(l.id)}" style="color:var(--loss)">(sil)</a>`).join(', ')}</div>`:''}

 <div class="day">Notlar</div>
 <div class="msg">Veriler football-data.org ve TheSportsDB'den çekilir (Flashscore'un resmî ücretsiz API'si yoktur). Ücretsiz pakette skorlar birkaç dakika gecikebilir; canlı dakika/istatistik gösterilmez. Tüm maç, kupon ve ayarlar yalnızca bu cihazda saklanır.</div>
 </div>`;
}
function sheetHTML(){
 const [lgId,tid]=S.sheet,lg=allLeagues().find(l=>l.id===lgId);if(!lg)return '';
 const d=getD(lg),ms=Object.values(d.matches);
 const t=teamList(d).find(x=>x.id===tid);if(!t)return '';
 const st=tstats(tid,ms);
 const mine=ms.filter(m=>m.h.id===tid||m.a.id===tid).sort((a,b)=>a.date<b.date?-1:1);
 const done=mine.filter(m=>m.status==='FINISHED').reverse(),nx=mine.filter(m=>m.status!=='FINISHED');
 return `<div class="in"><h2>${crest(t.c)}${esc(t.n)}<span style="flex:1"></span><button class="btn sm" data-a="close">Kapat</button></h2>
 <div style="margin:6px 0">Son 5: ${formHTML(st)}</div>
 <div class="kp"><div><b>${st.p}</b><span>Maç</span></div><div><b>${st.w}-${st.d}-${st.l}</b><span>G-B-M</span></div><div><b>${st.gf}:${st.ga}</b><span>Gol</span></div><div><b>${st.pts}</b><span>Puan</span></div></div>
 <div class="day">Sıradaki maçlar</div>${nx.length?nx.slice(0,5).map(m=>rowHTML(m,lg.id)).join(''):'<div class="msg">Yüklü gelecek maç yok.</div>'}
 <div class="day">Oynanan maçlar</div>${done.length?done.map(m=>rowHTML(m,lg.id)).join(''):'<div class="msg">Yüklü sonuç yok.</div>'}</div>`;
}
function render(){
 const tabs=[['hafta','📅','Hafta'],['mac','⚽','Maçlar'],['puan','🏆','Puan'],['kiyas','⚖️','Kıyasla'],['oner','🎯','Tavsiye'],['kupon','🎟️','Kupon'],['ayar','⚙️','Ayarlar']];
 const cpn=LS.get('coupon',[]).length;
 const lg=curLg(),d=S.data[dkey(lg,getSeason(lg))];
 const upd=d&&d.t?(SRCN[d.via||lg.src]||'')+' · '+new Date(d.dataT||d.t).toLocaleString(LOC(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
 const view={hafta:viewHafta,mac:viewMac,puan:viewPuan,kiyas:viewKiyas,oner:viewOner,kupon:viewKupon,ayar:viewAyar}[S.tab]();
 const keepQ=document.activeElement&&document.activeElement.id==='q';
 $('#app').innerHTML=`<header><h1 style="display:flex;align-items:center;gap:8px">${LOGO} Futbol Takip</h1><small>${S.tab==='hafta'?'':upd}</small><select class="lsel" data-a="lang" aria-label="Language">${LANGS.map(([c,n])=>`<option value="${c}"${c===LANG?' selected':''}>${n}</option>`).join('')}</select>${['mac','puan','kiyas'].includes(S.tab)?'<button class="btn sm" data-a="refresh">↻</button>':''}</header>${view}<nav>${tabs.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}"><i>${i}</i>${LANG==='tr'?l:NAVT[k][LI[LANG]]}${k==='kupon'&&cpn?`<em>${cpn}</em>`:''}</button>`).join('')}</nav>`;
 if(keepQ){const q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
 const sh=$('#sheet');
 if(S.sheet){sh.innerHTML=sheetHTML();sh.classList.add('show')}else{sh.classList.remove('show');sh.innerHTML=''}
 applyLang();
}

/* ====== Olaylar ====== */
async function ensureRound(){
 const lg=curLg();if((getD(lg).via||lg.src)!=='TS')return;
 const y=getSeason(lg),d=getD(lg),k=dkey(lg,y);
 const key=S.rk[k];if(!key||d.full)return;
 const r=+key.slice(1);
 if(!d.loaded[r]){S.busy=true;S.msg=r+'. hafta yükleniyor…';render();try{await loadRoundTS(lg,y,d,r,false);saveSnap(lg)}catch(e){S.err=errText(e)}S.busy=false;S.msg='';syncCoupon();render()}
}
document.addEventListener('click',async ev=>{
 if(ev.target.id==='sheet'){S.sheet=null;render();return}
 const el=ev.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 if(el.tagName==='A')ev.preventDefault();
 switch(a){
  case 'tab':S.tab=v;S.err='';LS.set('tab',v);render();window.scrollTo(0,0);if(['mac','puan','kiyas'].includes(v)){const lg=curLg(),d=getD(lg);if(!Object.keys(d.matches).length)load(false)}break;
  case 'lg':S.lg=el.dataset.id;LS.set('lg',S.lg);S.err='';S.cmp={a:'',b:''};S.q='';{const d=getD(curLg());if(!Object.keys(d.matches).length||(d.table==null&&S.tab==='puan'))await load(false);else{render()}}break;
  case 'refresh':load(true);break;
  case 'filter':S.filter=v;render();break;
  case 'hf':S.hf=v;render();break;
  case 'rnd':{const lg=curLg(),y=getSeason(lg),d=getD(lg),k=dkey(lg,y),{rounds,cur}=getRounds(lg,d);const rk=S.rk[k]||cur;let i=rounds.findIndex(r=>r.key===rk);i=Math.min(rounds.length-1,Math.max(0,i+(+v)));S.rk[k]=rounds[i].key;render();ensureRound();break}
  case 'team':S.sheet=[el.dataset.lg,el.dataset.id];render();break;
  case 'close':S.sheet=null;render();break;
  case 'cp':toggleCoupon(el.dataset.lg,el.dataset.id);render();break;
  case 'wk':S.wk+=+v;render();break;
  case 'wk0':S.wk=0;render();break;
  case 'fav':{let f=LS.get('favs',DEFAULT_FAVS);const id=el.dataset.id;f=f.includes(id)?f.filter(x=>x!==id):f.concat(id);LS.set('favs',f);render();break}
  case 'loadall':loadAll(true);break;
  case 'loaddeep':loadAll(false,true);break;
  case 'advadd':{const adv=buildAdvice(analyzePool(S.adv.days));const cp=LS.get('coupon',[]);adv.forEach(x=>{const ix=cp.findIndex(i=>i.lg===x.lg.id&&i.mid===x.m.id);if(ix>=0){cp[ix].pick=x.pk.k;cp[ix].odd=f1(x.pk.o);cp[ix].est=!x.pk.real}else cp.push({lg:x.lg.id,mid:x.m.id,m:x.m,pick:x.pk.k,odd:f1(x.pk.o),est:!x.pk.real})});LS.set('coupon',cp);S.tab='kupon';LS.set('tab','kupon');render();window.scrollTo(0,0);break}
  case 'swap':{const t=S.cmp.a;S.cmp.a=S.cmp.b;S.cmp.b=t;render();break}
  case 'pick':{const cp=LS.get('coupon',[]);cp[+el.dataset.i].pick=v;LS.set('coupon',cp);render();break}
  case 'rm':{const cp=LS.get('coupon',[]);cp.splice(+el.dataset.i,1);LS.set('coupon',cp);render();break}
  case 'cclear':if(confirm('Kuponu temizle?')){LS.set('coupon',[]);render()}break;
  case 'csave':{const cp=LS.get('coupon',[]);if(!cp.length)break;const hs=LS.get('chist',[]);hs.unshift({t:Date.now(),items:cp});LS.set('chist',hs);LS.set('coupon',[]);render();break}
  case 'chdel':if(confirm('Kayıtlı kuponu sil?')){const hs=LS.get('chist',[]);hs.splice(+el.dataset.i,1);LS.set('chist',hs);render()}break;
  case 'nettest':{
   const box=$('#nt');box.style.display='block';box.textContent=trs('Test ediliyor…');
   const out=['Adres: '+location.protocol+'//'+(location.host||'(dosya)')+' · çevrimiçi: '+navigator.onLine];
   const t=async(name,fn)=>{const t0=Date.now();try{const j=await fn();out.push('✓ '+name+' ('+(Date.now()-t0)+' ms)'+(j?' · '+j:''))}catch(e){out.push('✗ '+name+': '+(e.status||e.name||'')+' '+(e.message||''))}box.textContent=trs(out.join('\n'))};
   await t('Genel internet (api.github.com)',async()=>{const r=await fetch('https://api.github.com/zen');if(!r.ok)throw new Error('HTTP '+r.status);return ''});
   await t('Veri dosyası (data/ klasörü)',async()=>{const r=await fetch('data/index.json?v='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status+' (veri botu kurulu değil)');const j=await r.json();return 'son güncelleme: '+j.t});
   await t('Ağ erişimi (CORS hariç) · ESPN',async()=>{await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard',{mode:'no-cors'});return 'ağ var; ESPN CORS testi aşağıda'});
   await t('football-data.org',async()=>{const j=await fd('/competitions/PL');return j.name||''});
   await t('TheSportsDB',async()=>{const j=await ts('eventsnextleague.php?id=4339');return (j.events||[]).length+' maç bulundu'});
   await t('ESPN (anahtarsız, resmî değil)',async()=>{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return (j.events||[]).length+' maç bulundu'});
   break}
  case 'savekeys':LS.set('token',($('#tok').value||'').trim());LS.set('tskey',($('#tsk').value||'').trim());alert('Kaydedildi. Maçlar sekmesinden ↻ ile veriyi yükleyebilirsin.');break;
  case 'clearcache':if(confirm('Yüklenen maç verileri silinsin? (Kuponların ve ayarların silinmez)')){Object.keys(localStorage).filter(k=>k.indexOf('fk_snap_')===0).forEach(k=>localStorage.removeItem(k));S.data={};render()}break;
  case 'addlg':{const n=($('#cn').value||'').trim(),i=($('#ci').value||'').trim();if(!n||!/^\d+$/.test(i)){alert('Ad ve sayısal ID gir.');break}const cu=LS.get('custom',[]);if(!cu.some(l=>l.code===i)){cu.push({id:'TS:'+i,src:'TS',code:i,name:n,flag:'⚽',max:38});LS.set('custom',cu)}render();break}
  case 'rmlg':{LS.set('custom',LS.get('custom',[]).filter(l=>l.id!==el.dataset.id));render();break}
 }
});
document.addEventListener('change',ev=>{
 const el=ev.target,a=el.dataset&&el.dataset.a;if(!a)return;
 if(a==='season'){setSeason(curLg(),+el.value);const d=getD(curLg());Object.keys(d.matches).length?render():load(false)}
 else if(a==='cmpA'){S.cmp.a=el.value;render()}
 else if(a==='cmpB'){S.cmp.b=el.value;render()}
 else if(a==='odd'){const cp=LS.get('coupon',[]);cp[+el.dataset.i].odd=el.value;cp[+el.dataset.i].est=false;LS.set('coupon',cp);render()}
 else if(a==='advmin'){S.adv.minOdd=Math.max(1,+el.value||1.25);LS.set('adv',S.adv);render()}
 else if(a==='stake'){LS.set('stake',+el.value||0);render()}
 else if(a==='espfirst'){LS.set('espfirst',el.checked)}
 else if(a==='lang'){setLang(el.value)}
 else if(a==='advn'){S.adv.n=+el.value;LS.set('adv',S.adv);render()}
 else if(a==='advmode'){S.adv.mode=el.value;LS.set('adv',S.adv);render()}
 else if(a==='advdays'){S.adv.days=+el.value;LS.set('adv',S.adv);render()}
});
document.addEventListener('input',ev=>{
 const el=ev.target;if(el.dataset&&el.dataset.a==='q'){S.q=el.value;render()}
});
