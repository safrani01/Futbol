name: Futbol verisi güncelle

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verileri çek
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: |
          cat > veri_cek.py <<'PYEOF'
          import json, os, sys, time, datetime as dt
          import urllib.request, urllib.error

          TOKEN = os.environ.get("FD_TOKEN", "").strip()
          FD_BASE = "https://api.football-data.org/v4"
          ES_BASE = "https://site.api.espn.com/apis"
          OUT = "data"
          UA = {"User-Agent": "Mozilla/5.0 (futbol-takip veri botu)"}

          # uygulama_id, espn_kodu, fd_kodu, kupa mi, takvim yili mi (Brezilya), turnuva yili
          LEAGUES = [
              ("TS:4339", "tur.1", None, False, False, None),
              ("FD:PL", "eng.1", "PL", False, False, None),
              ("FD:PD", "esp.1", "PD", False, False, None),
              ("FD:BL1", "ger.1", "BL1", False, False, None),
              ("FD:SA", "ita.1", "SA", False, False, None),
              ("FD:FL1", "fra.1", "FL1", False, False, None),
              ("FD:CL", "uefa.champions", "CL", True, False, None),
              ("TS:4481", "uefa.europa", None, True, False, None),
              ("FD:DED", "ned.1", "DED", False, False, None),
              ("FD:PPL", "por.1", "PPL", False, False, None),
              ("FD:ELC", "eng.2", "ELC", False, False, None),
              ("FD:BSA", "bra.1", "BSA", False, True, None),
              ("FD:WC", "fifa.world", "WC", True, False, 2026),
              ("FD:EC", "uefa.euro", "EC", True, False, 2024),
          ]

          STAGES = {
              "GROUP_STAGE": "Grup Aşaması", "LEAGUE_STAGE": "Lig Aşaması", "PLAYOFFS": "Play-off",
              "LAST_16": "Son 16", "ROUND_OF_16": "Son 16", "LAST_32": "Son 32",
              "QUARTER_FINALS": "Çeyrek Final", "SEMI_FINALS": "Yarı Final",
              "THIRD_PLACE": "3.lük Maçı", "FINAL": "Final",
          }


          def get(url, headers=None, tries=2):
              h = dict(UA)
              if headers:
                  h.update(headers)
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=h)
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and i < tries - 1:
                          print("  429, 65 sn bekleniyor", flush=True)
                          time.sleep(65)
                          continue
                      raise
                  except Exception:
                      if i < tries - 1:
                          time.sleep(3)
                          continue
                      raise


          def season_year():
              n = dt.date.today()
              return n.year if n.month >= 7 else n.year - 1


          # ---------- football-data.org ----------
          def n_fd(m, cup):
              def t(x):
                  x = x or {}
                  return {"id": str(x.get("id") or "tbd"),
                          "n": x.get("shortName") or x.get("name") or "Belli değil",
                          "c": x.get("crest") or ""}
              st = m.get("status")
              status = "SCHEDULED"
              if st in ("FINISHED", "AWARDED"):
                  status = "FINISHED"
              elif st in ("IN_PLAY", "PAUSED", "LIVE"):
                  status = "LIVE"
              elif st in ("POSTPONED", "SUSPENDED", "CANCELLED"):
                  status = "PPD"
              ft = ((m.get("score") or {}).get("fullTime")) or {}
              md, stage = m.get("matchday"), m.get("stage")
              if md is not None and (not stage or stage in ("REGULAR_SEASON", "GROUP_STAGE", "LEAGUE_STAGE")):
                  key, rl = "MD%s" % md, "%s. %s" % (md, "Maç Günü" if cup else "Hafta")
              else:
                  key = stage or ("MD%s" % md)
                  rl = STAGES.get(stage) or stage or ("%s. Hafta" % md)
              played = status in ("FINISHED", "LIVE")
              return {"id": str(m["id"]), "date": m.get("utcDate"), "status": status,
                      "h": t(m.get("homeTeam")), "a": t(m.get("awayTeam")),
                      "hg": ft.get("home") if played else None, "ag": ft.get("away") if played else None,
                      "key": key, "rl": rl, "grp": m.get("group") or ""}


          def n_tab_fd(j):
              out = []
              for s in j.get("standings") or []:
                  if s.get("type") != "TOTAL":
                      continue
                  g = s.get("group") or ""
                  if g.startswith("GROUP_"):
                      g = "Grup " + g[6:]
                  rows = []
                  for r in s.get("table") or []:
                      tm = r.get("team") or {}
                      rows.append({"pos": r.get("position"),
                                   "t": {"id": str(tm.get("id")), "n": tm.get("shortName") or tm.get("name"), "c": tm.get("crest") or ""},
                                   "p": r.get("playedGames"), "w": r.get("won"), "d": r.get("draw"), "l": r.get("lost"),
                                   "gf": r.get("goalsFor"), "ga": r.get("goalsAgainst"), "pts": r.get("points")})
                  out.append({"name": g, "rows": rows})
              return out


          def from_fd(app_id, code, cup, y):
              hdr = {"X-Auth-Token": TOKEN}
              j = get("%s/competitions/%s/matches?season=%s" % (FD_BASE, code, y), hdr)
              matches = [n_fd(m, cup) for m in j.get("matches") or []]
              time.sleep(7)
              table = []
              try:
                  table = n_tab_fd(get("%s/competitions/%s/standings?season=%s" % (FD_BASE, code, y), hdr))
              except Exception as e:
                  print("  puan durumu alınamadı:", e)
              time.sleep(7)
              return matches, table


          # ---------- ESPN ----------
          def num(v):
              try:
                  return None if v in (None, "") else int(float(v))
              except Exception:
                  return None


          def n_es(e):
              c = ((e.get("competitions") or [{}])[0]) or {}
              cs = c.get("competitors") or []
              H = next((x for x in cs if x.get("homeAway") == "home"), cs[0] if cs else {})
              A = next((x for x in cs if x.get("homeAway") == "away"), cs[1] if len(cs) > 1 else {})

              def tm(x):
                  t = x.get("team") or {}
                  logo = t.get("logo") or ((t.get("logos") or [{}])[0].get("href") if t.get("logos") else "") or ""
                  return {"id": str(t.get("id") or x.get("id") or "tbd"),
                          "n": t.get("shortDisplayName") or t.get("displayName") or t.get("name") or "Belli değil",
                          "c": logo}
              st = ((e.get("status") or c.get("status") or {}).get("type")) or {}
              status = "SCHEDULED"
              if st.get("state") == "post" or st.get("completed"):
                  status = "FINISHED"
              elif st.get("state") == "in":
                  status = "LIVE"
              if any(k in (st.get("name") or "").upper() for k in ("POSTPONED", "CANCEL", "SUSPEND", "ABANDON")):
                  status = "PPD"
              played = status in ("FINISHED", "LIVE")
              return {"id": str(e.get("id")), "date": e.get("date"), "status": status,
                      "h": tm(H), "a": tm(A),
                      "hg": num(H.get("score")) if played else None, "ag": num(A.get("score")) if played else None,
                      "key": "", "rl": "", "grp": ""}


          def assign_rounds(ms, cup):
              cnt = {}
              for m in sorted(ms, key=lambda x: x["date"] or ""):
                  r = max(cnt.get(m["h"]["id"], 0), cnt.get(m["a"]["id"], 0)) + 1
                  cnt[m["h"]["id"]] = r
                  cnt[m["a"]["id"]] = r
                  m["key"] = "MD%d" % r
                  m["rl"] = "%d. %s" % (r, "Maç Günü" if cup else "Hafta")


          def es_ranges(y, cal, tour):
              if tour:
                  return ["%d0601-%d0731" % (tour, tour)]
              if cal:
                  return ["%d0101-%d0228" % (y, y), "%d0301-%d0430" % (y, y), "%d0501-%d0630" % (y, y),
                          "%d0701-%d0831" % (y, y), "%d0901-%d1031" % (y, y), "%d1101-%d1231" % (y, y)]
              return ["%d0701-%d0930" % (y, y), "%d1001-%d1130" % (y, y), "%d1201-%d0131" % (y, y + 1),
                      "%d0201-%d0331" % (y + 1, y + 1), "%d0401-%d0531" % (y + 1, y + 1), "%d0601-%d0630" % (y + 1, y + 1)]


          def n_tab_es(j):
              groups = []
              kids = j.get("children") or [j]
              for ch in kids:
                  ent = ((ch.get("standings") or {}).get("entries")) or []
                  if not ent:
                      continue
                  rows = []
                  for en in ent:
                      s = {x.get("name"): x.get("value") for x in en.get("stats") or []}
                      t = en.get("team") or {}
                      logo = t.get("logo") or ((t.get("logos") or [{}])[0].get("href") if t.get("logos") else "") or ""
                      rows.append({"pos": int(s.get("rank") or 0),
                                   "t": {"id": str(t.get("id")), "n": t.get("shortDisplayName") or t.get("displayName"), "c": logo},
                                   "p": int(s.get("gamesPlayed") or 0), "w": int(s.get("wins") or 0),
                                   "d": int(s.get("ties") or 0), "l": int(s.get("losses") or 0),
                                   "gf": int(s.get("pointsFor") or 0), "ga": int(s.get("pointsAgainst") or 0),
                                   "pts": int(s.get("points") or 0)})
                  rows.sort(key=lambda r: r["pos"])
                  name = (ch.get("name") or "") if len(kids) > 1 else ""
                  groups.append({"name": name, "rows": rows})
              return groups


          def from_es(slug, cup, y, cal, tour):
              seen = {}
              for rg in es_ranges(y, cal, tour):
                  j = get("%s/site/v2/sports/soccer/%s/scoreboard?dates=%s&limit=500" % (ES_BASE, slug, rg))
                  for e in j.get("events") or []:
                      m = n_es(e)
                      seen[m["id"]] = m
              matches = list(seen.values())
              assign_rounds(matches, cup)
              table = []
              try:
                  table = n_tab_es(get("%s/v2/sports/soccer/%s/standings" % (ES_BASE, slug)))
              except Exception as e:
                  print("  ESPN puan durumu alınamadı:", e)
              return matches, table


          def main():
              os.makedirs(OUT, exist_ok=True)
              ok = 0
              for app_id, slug, code, cup, cal, tour in LEAGUES:
                  y = tour or season_year()
                  print(app_id, y, flush=True)
                  res, src = None, None
                  if code and TOKEN:
                      try:
                          res, src = from_fd(app_id, code, cup, y), "FD"
                      except Exception as e:
                          print("  football-data hata:", e)
                  if (not res or not res[0]) and slug:
                      try:
                          res, src = from_es(slug, cup, y, cal, tour), "ES"
                      except Exception as e:
                          print("  ESPN hata:", e)
                  if not res or not res[0]:
                      print("  veri yok, atlandı")
                      continue
                  matches, table = res
                  doc = {"t": dt.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "src": src, "season": y,
                         "matches": matches, "table": table}
                  with open(os.path.join(OUT, app_id.replace(":", "_") + ".json"), "w", encoding="utf-8") as f:
                      json.dump(doc, f, ensure_ascii=False, separators=(",", ":"))
                  print("  %s: %d maç, %d tablo" % (src, len(matches), len(table)))
                  ok += 1
              with open(os.path.join(OUT, "index.json"), "w") as f:
                  json.dump({"t": dt.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "leagues": ok}, f)
              if ok == 0:
                  sys.exit(1)


          if __name__ == "__main__":
              main()
          PYEOF
          python3 veri_cek.py
          rm -f veri_cek.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-botu"
          git config user.email "veri-botu@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Veri güncellendi" && git push)
